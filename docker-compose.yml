services:
  db:
    image: postgis/postgis:15-3.3
    container_name: gcn_db
    environment:
      POSTGRES_DB: greencity
      POSTGRES_USER: greencity
      POSTGRES_PASSWORD: greencity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gcn_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://greencity:greencity@db:5432/greencity
    volumes:
      - .:/app

  dashboard:
    build: .
    container_name: gcn_dashboard
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    volumes:
      - .:/app

volumes:
  postgres_data: